name: Felix Kronenwett
title: PhD Candidate at KIT (ISAS) · Research Associate at Fraunhofer IOSB
bio: >
  I develop machine learning methods for visual inspection and sensor-based sorting.
  I am a PhD candidate at the Intelligent Sensor-Actuator-Systems Laboratory (ISAS) at KIT and a research associate in the Visual Inspection Systems department at Fraunhofer IOSB.
  My research focuses on Bayesian deep learning methods that quantify prediction uncertainty to make visual inspection systems more reliable under changing conditions.
  In particular, I address challenging computer vision tasks such as segmenting bulk material at high throughput and dense material coverage.
interests:
  - Probabilistic Machine Learning
  - Bayesian Deep Learning
  - Uncertainty Quantification
  - Computer Vision
  - Hyperspectral Imaging
  - Sensor-Based Sorting
  - Real-Time Systems
  - Sustainable Recycling & Agriculture
